<!DOCTYPE html>
<html>
    <head>
        <title>Settings</title>
        <link rel="stylesheet" href="stylesettings-payment.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <a href = "home-signin.html">
                    <img src="images/ACE!Save.jpg" alt="ACE!Save">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="menu-signin.html">SHOP</a></li>
                <li><a href="order-signin.html">CART</a></li>
            </ul>
            <div class="profile-container">
            <button
                type="button"
                class="profile-circle"
                id="profileBtn"
                aria-label="Open profile menu"
                aria-expanded="false"
            >
                U
            </button>
            <div class="profile-panel" id="profilePanel">
                <div class="profile-info">
                    <div class="profile-avatar">U</div>
                    <div class="profile-details">
                        <h3 id="profile-name">Guest</h3>
                        <p id="profile-email">Create an account</p>
                    </div>
                </div>
                <hr>
                <a href="settings.html">Settings</a>
                <a href="notifications.html">Notifications</a>
                <hr>
                <a href="home.html">
                <button
                    type="button"
                    class="logout-button"
                    id="logoutBtn"
                >
                    Log Out
                </button>
                </a>
            </div>
        </div>
        </nav>
        <div class="terms">
        <h1>Settings</h1>
        <a href = "settings.html"> <b>Account Details</b></a> |
        <a href = "settings-address.html"> <b>Address</b></a> |
        <a href = "settings-payment.html"> <b>Payment Method</b></a>
        <hr>
        <h2>Payment Method</h2>
        <select id="payment-method" required>
            <option value="">Choose a method</option>
            <option value="Visa">Visa</option>
            <option value="MasterCard">MasterCard</option>
        </select>
        <br>
        <br>
        <label>Cardholder Name</label>
        <input id="cardholder-name" type="text" required maxlength="100">
        <br>
        <br>
        <label>Card Number</label>
        <input id="card-number" type="text" required inputmode="numeric" maxlength="19">
        <br>
        <br>
        <label>Expiration Date</label>
        <input id="expiration-date" type="text" required placeholder="MM/YY" maxlength="5">
        <br>
        <br>
        <label>CVV / CVC</label>
        <input id="cvv" type="text" required inputmode="numeric" maxlength="4">
        <br>
        <br>
        <button id="save-payment-details" type="button">Save</button>
        </div>
        <hr>
    <h5>
        © 2026 ACE Incorporation. All rights reserved.
        <br>
        <hr class="short-line">
        <a href="terms-signin.html">Terms and Conditions</a> |
        <a href="helpandsupport-signin.html">Help & Support</a>
    </h5>
    <script src="saved.js"></script>
    <script src="profile-drop.js"></script>
    </body>
</html>
