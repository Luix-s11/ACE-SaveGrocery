<!DOCTYPE html>
<html>
    <head>
        <title>Sign In</title>
        <link rel="stylesheet" href="styleregistration.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <a href = "home.html">
                    <img src="images/ACE!Save.jpg" alt="ACE!Save">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="menu.html">SHOP</a></li>
                <li><a href="registration-signin.html?return=order.html">CART</a></li>
            </ul>
            <a href="registration-signin.html">
            <button>Sign in</button>
            </a>
        </nav>
        <h1>Sign In</h1>
        <hr>
        <form id="signin-form" class="auth-form">
            <div class="form-row">
                <label for="signin-email">Email</label>
                <input id="signin-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form-row">
                <label for="signin-password">Password</label>
                <input id="signin-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
            <div class="link-wrapper">
                <a href="registration-forgotpass.html">Forgot Password</a>
                <br><br>
                <a href="registration-signup.html">No Account? Sign Up Now!</a>
            </div>
            <div class="button-container">
                <button type="submit">Sign In</button>
            </div>
        </form>
        <br>
        <hr>
    <h5>
        © 2026 ACE Incorporation. All rights reserved.
        <br>
        <hr class="short-line">
        <a href="terms.html">Terms and Conditions</a> |
        <a href="helpandsupport.html">Help & Support</a>
    </h5>
        <script src="auth.js"></script>
    </body>
</html>
