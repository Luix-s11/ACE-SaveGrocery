<!DOCTYPE html>
<html>
    <head>
        <title>Shop With Us!</title>
        <link rel="stylesheet" href="stylemenu-signin.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <a href = "home-signin.html">
                    <img src="images/ACE!Save.jpg" alt="ACE!Save">
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="menu-signin.html">SHOP</a></li>
                <li><a href="order-signin.html">CART <span class="cart-count" id="cart-count">0</span></a></li>
            </ul>

            

        <div class="profile-container">
            <button
                type="button"
                class="profile-circle"
                id="profileBtn"
                aria-label="Open profile menu"
                aria-expanded="false"
            >
                U
            </button>
            <div class="profile-panel" id="profilePanel">
                <div class="profile-info">
                    <div class="profile-avatar">U</div>
                    <div class="profile-details">
                        <h3 id="profile-name">Guest</h3>
                        <p id="profile-email">Create an account</p>
                    </div>
                </div>
                <hr>
                <a href="settings.html">Settings</a>
                <a href="notifications.html">Notifications</a>
                <hr>
                <a href="menu.html">
                <button
                    type="button"
                    class="logout-button"
                    id="logoutBtn"
                >
                    Log Out
                </button>
                </a>
            </div>
        </div>
        </nav>
        <main class="shopping-page">
            <h1>Shop</h1>
            <p class="shop-intro">Choose a category to browse products, then add your items to the cart.</p>
            <div class="shop-search" role="search">
                <label for="shop-search-input">Search the shop</label>
                <div class="search-input-row">
                    <span class="search-icon" aria-hidden="true">⌕</span>
                    <input
                        id="shop-search-input"
                        type="search"
                        placeholder="Search products, categories, or descriptions..."
                        autocomplete="off"
                        aria-controls="product-categories"
                    >
                    <button id="shop-search-clear" class="search-clear-button" type="button" hidden>Clear</button>
                </div>
                <p id="shop-search-status" class="search-status" role="status" aria-live="polite"></p>
            </div>
            <div id="product-categories" class="category-browser"></div>
            <p id="store-message" class="store-message" role="status" aria-live="polite"></p>
        </main>
    <h5>
        © 2026 ACE Incorporation. All rights reserved.
        <br>
        <hr class="short-line">
        <a href="terms-signin.html">Terms and Conditions</a> |
        <a href="helpandsupport-signin.html">Help & Support</a>
    </h5>
        <script src="auth.js"></script>
        <script src="profile-drop.js"></script>
        <script src="store.js"></script>
    </body>
</html>
